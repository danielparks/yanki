[project]
name = "yanki"
dynamic = ["readme", "version"]
description = "Build flashcard decks from text files containing YouTube URLs."
authors = [{ name = "Daniel Parks", email = "oss-yanki@demonhorse.org" }]
requires-python = ">= 3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-*"]
keywords = ["anki", "flashcards"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Topic :: Education",
]

dependencies = [
    "yt-dlp >=2026.6.9",
    "genanki >=0.13.1,<0.14",
    "docutils>=0.21.2,<0.24",
    "ffmpeg-python >=0.2.0,<0.3",
    "colorlog >=6.9.0,<7.0",
    "click >=8.1.8,<9.0",
    "mistletoe>=1.4.0",
    "pytest-asyncio>=1.1.0",
    "unidecode>=1.4.0",
    "yt-dlp-ejs>=0.3.1",
]

[dependency-groups]
dev = [
    "pytest~=9.0",
    "ruff>0.8.4",
    "pre-commit>=4.0.1,<5",
    "pytest-console-scripts>=1.4.1,<2",
    "psutil>=6.1.1,<8",
]

[project.urls]
Homepage = "https://github.com/danielparks/yanki"
Source = "https://github.com/danielparks/yanki"
ChangeLog = "https://github.com/danielparks/yanki/blob/main/CHANGELOG.md"
Issues = "https://github.com/danielparks/yanki/issues"

[project.scripts]
yanki = "yanki.cli:main"

[tool.pytest.ini_options]
log_cli_level = "DEBUG"

[tool.ruff]
line-length = 80

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "A",       # I don’t mind shadowing built-ins.
    "ANN",     # FIXME? type annotations.
    "cached-instance-method",    # FIXME: `functools.cache` can leak memory.
    "missing-trailing-comma",  # Conflicts with formatter.
    "CPY",     # I don’t want copyright notices at the top of every file.
    "D1",      # FIXME: Undocumented public items.
    "DOC",     # FIXME: Undocumented returns, raises, etc.
    "EM",      # I don’t like the `msg = ...; raise Error(msg)` syntax.
    "FIX",     # I like FIXME comments for low-priority stuff.
    "logging-f-string",    # I prefer f-strings for logging for clarity.
    "compare-to-empty-string", # Explicit comparisons to `""` are often clearer.
    "too-many-public-methods", # FIXME? Too many public methods.
    "too-many-return-statements", # I don’t care about too many returns.
    "magic-value-comparison", # “Magic” values often easier to understand without a CONSTANT.
    "no-self-use", # Too many false positive (methods that don’t need `self`).
    "too-many-statements-in-try-clause", # Nothing wrong with a big `try` block.
    "redefined-loop-name", # I like to shadow `for` loop variables.
    "pytest-raises-too-broad",   # `pytest.raises(...)` is too broad: Too many false positives.
    "unnecessary-paren-on-raise-exception",  # Always use parentheses raising an exception for consistency.
    "suspicious-subprocess-import",    # I use `subprocess`.
    "subprocess-without-shell-equals-true",    # This seems to trigger on all calls to `subprocess.run`.
    "T20",     # We use `print()`.
    "TD",      # I prefer my FIXME format.
    "raise-vanilla-args",  # It’s a lot more work to have separate error classes.
    "redundant-open-modes",   # I prefer to be explicit about opening files for reading.

    # I frequently use characters that trigger these lints like "’"  and "❯":
    "ambiguous-unicode-character-string",
    "ambiguous-unicode-character-docstring",
    "ambiguous-unicode-character-comment",

    "non-empty-init-module",  # Minimal `__init__` (I may wish to enable later).
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "implicit-namespace-package", # Don't care about implicit namespace in tests.
    "assert",   # assert is fine in tests.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
exclude-newer = "30 days"

[tool.hatch.build.targets.wheel]
packages = ["yanki"]

[tool.hatch.version]
path = "yanki/__version__.py"

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/REFERENCE.adoc",
    "/test-decks",
    "/tests",
    "/uv.lock",
    "/web-files",
    "/yanki",
]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# Remove GitHub only sections from README.md.
pattern = '(?s)<!-- GitHub only -->.+<!-- /GitHub only -->'
replacement = ''

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# Replace GitHub-specific [!TIP] syntax.
pattern = '\[!TIP\]'
replacement = '### 💡 Tip'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# Make links to package files absolute GitHub links.
pattern = '(?m)^(\[.+?\]):\s*((?!\w+:)\S+)'
replacement = '\1: https://github.com/danielparks/yanki/blob/v$HFPR_VERSION/\2'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# Make image links to package files absolute GitHub links.
pattern = '(?m)^(!\[.+?\])\(((?!\w+:)\S+?)\)'
replacement = '\1(https://github.com/danielparks/yanki/raw/v$HFPR_VERSION/\2)'
